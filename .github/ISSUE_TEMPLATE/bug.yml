name: Bug report
description: Something is broken or calculates the wrong number
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real financial data, PAN, email, account/folio numbers or unredacted screenshots.**
        Security issues: use GitHub → Security → Advisories instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (with fake or redacted data)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kosh version or commit
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Dashboard,
          Holdings,
          Import / parser,
          Prices / refresh,
          Returns maths,
          Admin,
          Email,
          MCP,
          Other,
        ]
