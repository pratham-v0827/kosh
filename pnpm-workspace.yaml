packages:
  - apps/*
  - packages/*
  - firebase

# pnpm 12: dependencies allowed to run install scripts. Everything else is blocked by default.
allowBuilds:
  sharp: false # image optimisation; not needed on Vercel
  unrs-resolver: false
  protobufjs: false # postinstall only prints a version notice
  '@firebase/util': false # postinstall only serves Firebase App Hosting auto-init
  esbuild: true # vitest/vite need the platform binary check

# Security overrides (docs/audits/phase3-security.md). Keep each one justified and minimal.
overrides:
  # GHSA for grpc-js < 1.13.6 (client firebase SDK's Node build pins 1.9.x)
  '@grpc/grpc-js@<1.13.6': ^1.14.7
